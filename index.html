<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghar Khata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.GK_STANDALONE=true</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ghar Khata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one passbook per person. Sticky header holds the person tabs; section tabs sit at the bottom for thumb reach. Each person has their own ink colour. */
:root{
  --paper:#EDF2EE; --surface:#F9FBF9; --tint:#E0EBE5; --line:#CBD9D1;
  --ink:#12302A; --muted:#566F68; --accent:var(--c0); --accent-ink:#FFFFFF;
  --credit:#1D7442; --debit:#AE3528; --warn:#9A6512; --warn-bg:#F7ECD6;
  --c0:#0B6B5A; --c1:#7A3B8F; --c2:#9A5300; --c3:#2457A6; --c4:#AE3258; --c5:#4D6B12; --cfam:#3A3F63;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1614; --surface:#14201D; --tint:#1A2925; --line:#26382F;
  --ink:#E1EDE8; --muted:#8EA79F; --accent-ink:#0B1412;
  --credit:#5CCB8B; --debit:#F07E6F; --warn:#E5B451; --warn-bg:#2C2414;
  --c0:#4CC2A4; --c1:#C990DE; --c2:#EBA54A; --c3:#86ADF2; --c4:#F08AA6; --c5:#A9CC5A; --cfam:#B9BEE8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1614; --surface:#14201D; --tint:#1A2925; --line:#26382F;
  --ink:#E1EDE8; --muted:#8EA79F; --accent-ink:#0B1412;
  --credit:#5CCB8B; --debit:#F07E6F; --warn:#E5B451; --warn-bg:#2C2414;
  --c0:#4CC2A4; --c1:#C990DE; --c2:#EBA54A; --c3:#86ADF2; --c4:#F08AA6; --c5:#A9CC5A; --cfam:#B9BEE8; color-scheme:dark}

/* colour profiles: neutrals only; person colours stay */
:root[data-palette="slate"]{--paper:#EEF1F5;--surface:#FAFBFD;--tint:#E2E8F0;--line:#CBD3DF;--ink:#18212F;--muted:#5A6577}
@media (prefers-color-scheme: dark){:root[data-palette="slate"]:not([data-theme="light"]){--paper:#0F141B;--surface:#161D27;--tint:#1D2734;--line:#2A3544;--ink:#E3E8EF;--muted:#93A0B2}}
:root[data-palette="slate"][data-theme="dark"]{--paper:#0F141B;--surface:#161D27;--tint:#1D2734;--line:#2A3544;--ink:#E3E8EF;--muted:#93A0B2}
:root[data-palette="clay"]{--paper:#F0ECE7;--surface:#FBF9F7;--tint:#E7DFD5;--line:#D5CABD;--ink:#2A231C;--muted:#6E6254}
@media (prefers-color-scheme: dark){:root[data-palette="clay"]:not([data-theme="light"]){--paper:#16130F;--surface:#1F1A15;--tint:#29231C;--line:#3A3128;--ink:#EEE6DB;--muted:#AA9D8A}}
:root[data-palette="clay"][data-theme="dark"]{--paper:#16130F;--surface:#1F1A15;--tint:#29231C;--line:#3A3128;--ink:#EEE6DB;--muted:#AA9D8A}
:root[data-palette="lotus"]{--paper:#F4EEF1;--surface:#FCF9FA;--tint:#EEDFE6;--line:#DECAD4;--ink:#2E1724;--muted:#765E6B}
@media (prefers-color-scheme: dark){:root[data-palette="lotus"]:not([data-theme="light"]){--paper:#170F14;--surface:#20161C;--tint:#2A1D25;--line:#3B2A34;--ink:#F0E3EA;--muted:#B096A4}}
:root[data-palette="lotus"][data-theme="dark"]{--paper:#170F14;--surface:#20161C;--tint:#2A1D25;--line:#3B2A34;--ink:#F0E3EA;--muted:#B096A4}
:root[data-palette="contrast"]{--paper:#F2F2F2;--surface:#FFFFFF;--tint:#E6E6E6;--line:#9E9E9E;--ink:#000000;--muted:#3D3D3D}
@media (prefers-color-scheme: dark){:root[data-palette="contrast"]:not([data-theme="light"]){--paper:#000000;--surface:#0D0D0D;--tint:#1C1C1C;--line:#5A5A5A;--ink:#FFFFFF;--muted:#C8C8C8}}
:root[data-palette="contrast"][data-theme="dark"]{--paper:#000000;--surface:#0D0D0D;--tint:#1C1C1C;--line:#5A5A5A;--ink:#FFFFFF;--muted:#C8C8C8}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-block:0 104px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:17px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + person tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 0;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:23px;letter-spacing:-.01em}
.fysel{position:relative;display:inline-flex;align-items:center}
.fysel select{appearance:none;-webkit-appearance:none;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);background:var(--tint);border:1.5px solid var(--accent);border-radius:999px;padding:4px 26px 4px 11px;cursor:pointer}
.fysel .chev{position:absolute;right:10px;pointer-events:none;color:var(--accent);font-size:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fynote{font-size:12px;color:var(--muted);margin-top:-8px}
/* summary hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.8}
.hero .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero h2{font-size:24px}
.hero .sub{font-size:13px;opacity:.85}
.hero .arrows{display:flex;gap:6px}
.hero .arrows button{border:1.5px solid currentColor;background:none;color:inherit;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.hero .arrows button:disabled{opacity:.35;cursor:default}
.hero .bigsave{font-family:var(--mono);font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hero .rate{height:8px;border-radius:4px;background:rgb(255 255 255 / .25);overflow:hidden}
:root[data-theme="dark"] .hero .rate{background:rgb(0 0 0 / .2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .rate{background:rgb(0 0 0 / .2)}}
.hero .rate i{display:block;height:100%;background:currentColor;border-radius:4px}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid currentColor;padding-top:12px}
.hero .trio div{min-width:0}
.hero .trio b{display:block;font-family:var(--mono);font-size:16px;font-weight:600;overflow-wrap:anywhere}
.hero .trio span{font-size:12px;opacity:.85}
.nw{text-align:right}
.nw .v{font-family:var(--mono);font-size:17px;font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-s="cloud"] .dot{background:var(--credit)}
.status[data-s="local"] .dot,.status[data-s="memory"] .dot{background:var(--warn)}
.people{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.ptab{flex:none;display:flex;align-items:center;gap:7px;border:none;background:none;padding:8px 12px 10px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pc)}
.ptab.more{color:var(--accent);font-weight:600}
.av{width:24px;height:24px;border-radius:50%;background:var(--pc);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.av.lg{width:46px;height:46px;font-size:20px;font-family:var(--display);font-weight:400}

section.tab{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.notice{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice b{color:var(--warn)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--debit);border-color:var(--debit)}
.btn.link{border:none;background:none;padding:4px 2px;color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tint);border-radius:9px;padding:3px;gap:3px}
.seg button{border:none;background:none;padding:8px 4px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* chooser */
.hello{padding-top:26px;display:flex;flex-direction:column;gap:6px}
.hello h2{font-size:28px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;border-top:4px solid var(--pc)}
.pcard .who{display:flex;gap:12px;align-items:center}
.pcard .nm{font-family:var(--display);font-size:20px;overflow-wrap:anywhere}
.pcard .fig{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pcard .fig b{font-family:var(--mono);color:var(--ink);font-weight:600}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.pcard .acts .primary{flex:1}
.pcard.add{border-style:dashed;border-top-style:dashed;border-top-width:1px;--pc:var(--line)}

/* quick add */
.qa{display:flex;flex-direction:column;gap:14px}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amt:focus-within{border-color:var(--accent)}
.amt span{font-family:var(--mono);font-size:26px;color:var(--muted)}
.amt input{border:none;background:none;outline:none;font-family:var(--mono);font-size:34px;font-weight:600;width:100%;min-width:0;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .tg{font-family:var(--mono);font-size:10px;margin-left:4px;opacity:.75}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.field input.num{text-align:right}
.taxpill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--tint);color:var(--accent);font-weight:600}
.err{color:var(--debit);font-size:13px;min-height:1em}
.err.ok{color:var(--credit)}
.row-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px;min-width:0}
.stat .v{font-family:var(--mono);font-size:clamp(12.5px,3.5vw,17px);font-weight:600;margin-top:2px;white-space:nowrap;letter-spacing:-.02em}
.cr{color:var(--credit)} .dr{color:var(--debit)}
.stbtn{border:none;text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative;box-shadow:inset 0 -3px 0 transparent}
.stbtn:hover{background:var(--tint)}
.stbtn[aria-pressed="true"]{background:var(--tint);box-shadow:inset 0 -3px 0 var(--accent)}
.stbtn .hint{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px}
.drows{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.drow .s{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.drow .a{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.sum{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.sum b{font-family:var(--mono)}
.sum.tot{border-bottom:none;border-top:2px solid var(--ink);font-weight:600}
.rep{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);cursor:pointer;background:var(--tint);border-radius:8px;padding:10px 12px}
.rep input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.rep b{color:var(--ink);font-weight:600}
.fx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.fx .s{font-size:12px;color:var(--muted)}
.fx .a{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.fx .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fx .acts .btn{padding:5px 10px;font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--tint);color:var(--muted);margin-left:6px}
.pill.due{background:var(--warn-bg);color:var(--warn)}
.newcat{display:flex;gap:6px;align-items:center}
.newcat input{border:1px solid var(--accent);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;width:150px}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}
.drow.tx{border-left:none;border-right:none;border-top:none;background:none;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.drow.tx:hover>span:first-child{color:var(--accent)}
.drow.tx:disabled:hover>span:first-child{color:inherit}
table.stmt td,table.stmt th{padding:8px 6px}
table.stmt td:first-child{white-space:nowrap}
@media (max-width:480px){table.stmt{font-size:12.5px}table.stmt td,table.stmt th{padding:7px 3px}table.stmt th:nth-child(5),table.stmt td:nth-child(5){display:none}}
tr.fut td{color:var(--muted)}
.whob{display:inline-block;font-size:11px;font-weight:600;color:var(--pc);border:1px solid var(--pc);border-radius:4px;padding:0 5px;margin-right:6px;line-height:1.5}
.combo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 0 10px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.cchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.cchip .av{width:20px;height:20px;font-size:11px;background:var(--line);color:var(--surface)}
.cchip[aria-pressed="true"]{border-color:var(--pc);color:var(--ink);background:var(--tint)}
.cchip[aria-pressed="true"] .av{background:var(--pc);color:var(--accent-ink)}
.cchip .tick{font-size:12px;color:var(--pc);font-weight:700;min-width:8px}
.chctl{display:flex;flex-direction:column;gap:8px;margin:10px 0 10px}
.chctl .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.mchip i{width:10px;height:10px;border-radius:2px;background:var(--mc);opacity:.3}
.mchip[aria-pressed="true"]{border-color:var(--mc);color:var(--ink);font-weight:600}
.mchip[aria-pressed="true"] i{opacity:1}
.seg.sm button{padding:6px 10px;font-size:13px}
.readout{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;padding:8px 10px;background:var(--tint);border-radius:8px;margin-bottom:4px}
.readout b{font-family:var(--mono)}
.readout .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.gear{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.gear[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.brandrow{display:flex;gap:8px;align-items:center}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.palcard{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}
.palcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.palcard .strip{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid rgb(0 0 0 / .12)}
.palcard .strip i{flex:1}
.palcard b{font-weight:600;font-size:14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.sws{display:flex;gap:6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.filebox{display:flex;flex-direction:column;gap:10px}
.filebox input[type=file]{font-size:13px;max-width:100%}
.impnote{font-size:12px;color:var(--muted);margin:0}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.hrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.hrow .nm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.hrow .sub{grid-column:2/-1;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hrow .val{width:120px;text-align:right;font-family:var(--mono);border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 6px}
.hrow select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-size:12.5px;max-width:100%}
.hrow.off{opacity:.5}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.tools .seg{margin-bottom:12px}
.calcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cres{background:var(--tint);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cres .bigv{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rate{background:var(--tint);border-radius:8px;padding:8px 10px}
.rate b{display:block;font-family:var(--mono);font-size:17px}
.rate span{font-size:12px;color:var(--muted)}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.links a span{color:var(--muted);font-size:12px;text-align:right}
.links a:hover{color:var(--accent)}
.lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.lockcard h2{font-size:26px}
.lockcard input{font-family:var(--mono);font-size:26px;letter-spacing:.4em;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;width:100%}
.lockcard input:focus{border-color:var(--accent);outline:none}
.lockcard .btn{padding:11px 14px;font-size:15px}
.lockmark{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto}
.lockmark svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8}
body.locked .wrap,body.locked nav.tabs,body.locked .toast{visibility:hidden}
.pwrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.pwrow{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgb(0 0 0 / .2)}
.toast.bad{background:var(--debit);color:#fff}

.ledger{display:flex;flex-direction:column}
.day{font-family:var(--mono);font-size:12px;color:var(--muted);padding:12px 0 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border:none;border-bottom:1px dashed var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.tx:hover .t1{color:var(--accent)}
.tx .t1{font-weight:500;min-width:0;overflow-wrap:anywhere}
.tx .t2{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tx .a{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.tx .dc{font-size:11px;font-weight:500;margin-left:3px;opacity:.8}
.txopen{padding:8px 0 12px;border-bottom:1px dashed var(--line)}
.ex{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--warn);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px}

.mstep{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mstep .m{font-family:var(--display);font-size:20px;text-align:center}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.bar .h .num{font-size:13px;white-space:nowrap}
.track{height:8px;background:var(--tint);border-radius:4px;overflow:hidden;margin-top:5px}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.over{background:var(--debit)} .fill.near{background:var(--warn)}
.bar input{width:96px;text-align:right;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-family:var(--mono);font-size:13px}
.bar input.catname{flex:1;min-width:0;width:auto;text-align:left;font-family:var(--body);font-size:14px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.verdict{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.regime{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);min-width:0}
.regime.best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.regime .v{font-family:var(--mono);font-size:24px;font-weight:600;margin:4px 0}
.badge{font-size:11px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:4px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono)}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:none}
.auto{display:flex;flex-direction:column}
.auto div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.auto div span:last-child{font-family:var(--mono);white-space:nowrap}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.big{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em}
.acct{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border:none;border-bottom:1px dashed var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.acct .n{font-weight:500}
.acct .g{font-size:12px;color:var(--muted)}
.acct .b{font-family:var(--mono);font-weight:600;text-align:right}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button.sumtab{color:var(--ink);font-weight:600}
nav.tabs button.sumtab .ring{display:grid;place-items:center;width:44px;height:30px;border-radius:999px;background:var(--tint);border:1.5px solid var(--accent);margin-top:-2px}
nav.tabs button.sumtab svg{stroke:var(--accent)}
nav.tabs button.sumtab[aria-selected="true"]{color:var(--accent)}
nav.tabs button.sumtab[aria-selected="true"] .ring{background:var(--accent);border-color:var(--accent)}
nav.tabs button.sumtab[aria-selected="true"] svg{stroke:var(--accent-ink)}
nav.tabs button{border:none;background:none;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-selected="true"]{color:var(--accent)}

@media (max-width:480px){
  .stat{padding:12px 10px}
  .verdict{grid-template-columns:1fr}
  .big{font-size:28px}
  .nw .status{display:none}
  .ptab{padding:8px 9px 10px}
  .ptab:not(.more) .av{display:none}
  .ptab[data-act="multi"] .av{display:inline-grid;width:20px;height:20px;font-size:11px}

}

@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}

<script>
/* ================= constants ================= */
const CATS={
  expense:[
    {id:'groceries',name:'Groceries'},{id:'dining',name:'Food & dining'},{id:'rent',name:'Rent'},
    {id:'utilities',name:'Bills & utilities'},{id:'transport',name:'Transport & fuel'},{id:'child',name:'Child care'},
    {id:'school',name:'School fees',tax:'80C'},{id:'medical',name:'Medical'},{id:'healthins',name:'Health insurance',tax:'80D'},
    {id:'lifeins',name:'Life insurance',tax:'80C'},{id:'hlint',name:'Home loan interest',tax:'24(b)'},
    {id:'shopping',name:'Shopping'},{id:'fun',name:'Entertainment'},{id:'donation',name:'Donations',tax:'80G'},{id:'other',name:'Other'}],
  income:[
    {id:'salary',name:'Salary'},{id:'bonus',name:'Bonus'},{id:'sbint',name:'Savings interest',tax:'80TTA'},
    {id:'fdint',name:'FD / RD interest',tax:'Other src'},{id:'dividend',name:'Dividend',tax:'Other src'},
    {id:'rentin',name:'Rent received',tax:'House prop'},{id:'gift',name:'Gift / pocket money'},{id:'otherin',name:'Other income'}]
};
const CATMAP={};for(const t in CATS)for(const c of CATS[t])CATMAP[c.id]=c;
const TAXTAGS={'':'None','80C':'80C (PPF, ELSS, principal)','80CCD1B':'80CCD(1B) NPS'};
const GROUPS=['Bank','Cash','Deposits','Retirement','Investments','Property','Physical','Card','Loan','Other'];
const ROLES={adult:'Earning adult',child:'Child'};
const DEFAULT_PEOPLE=[{id:'self',name:'Self',role:'adult',color:0},{id:'spouse',name:'Spouse',role:'adult',color:1},{id:'child',name:'Child',role:'child',color:2}];
const BASE_TAX={gross:0,exempt:0,profTax:0,age:'below60',epf:0,extra80C:0,extra80D:0,extra1B:0,c80CCD2:0,extraOther:0,tds:0};
const A=(id,name,kind,group,opening,tax)=>({id,name,kind,group,opening,...(tax?{tax}:{})});
const TEMPLATES={
  self:{accounts:[A('bank','Savings account','asset','Bank',150000),A('cash','Cash in hand','asset','Cash',5000),A('fd','Fixed deposits','asset','Deposits',200000),
    A('ppf','PPF','asset','Retirement',300000,'80C'),A('epf','EPF','asset','Retirement',250000),A('nps','NPS Tier I','asset','Retirement',80000,'80CCD1B'),
    A('elss','ELSS mutual funds','asset','Investments',100000,'80C'),A('mf','Other mutual funds','asset','Investments',150000),
    A('card','Credit card','liability','Card',15000),A('carloan','Car loan','liability','Loan',250000),A('homeloan','Home loan','liability','Loan',0,'80C')],
    budgets:{groceries:12000,dining:4000,rent:22000,utilities:4000,transport:4000,child:8000,medical:2000,shopping:5000,fun:3000,other:3000},
    tax:{gross:1200000,profTax:2500,epf:21600}},
  spouse:{accounts:[A('bank','Savings account','asset','Bank',60000),A('cash','Cash in hand','asset','Cash',3000),A('ppf','PPF','asset','Retirement',120000,'80C'),
    A('mf','Mutual funds','asset','Investments',80000),A('gold','Gold','asset','Physical',150000),A('card','Credit card','liability','Card',0)],
    budgets:{groceries:6000,dining:2000,utilities:1500,transport:2500,medical:1000,shopping:4000,fun:2000,other:2000},
    tax:{gross:600000,profTax:2500}},
  child:{accounts:[A('bank','Savings account (minor)','asset','Bank',25000),A('cash','Piggy bank','asset','Cash',1500),A('ssy','Sukanya Samriddhi / PPF','asset','Retirement',50000,'80C')],
    budgets:{dining:1000,shopping:1000,fun:800,other:500},tax:{}},
  adult:{accounts:[A('bank','Savings account','asset','Bank',0),A('cash','Cash in hand','asset','Cash',0),A('card','Credit card','liability','Card',0)],budgets:{},tax:{}},
  kid:{accounts:[A('bank','Savings account (minor)','asset','Bank',0),A('cash','Piggy bank','asset','Cash',0)],budgets:{},tax:{}}
};
const tplFor=p=>TEMPLATES[p.id]&&['self','spouse','child'].includes(p.id)?TEMPLATES[p.id]:p.role==='child'?TEMPLATES.kid:TEMPLATES.adult;

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const rs=n=>(n<0?'−':'')+'₹'+NF.format(Math.abs(Math.round(n||0)));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fyStart=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m>=4?y:y-1};
const fyLabel=s=>s+'-'+pad((s+1)%100);
const fyMonths=s=>Array.from({length:12},(_,i)=>{const m=(3+i)%12+1,y=i<9?s:s+1;return y+'-'+pad(m)});
const mLabel=k=>MN[+k.slice(5,7)-1]+' '+k.slice(0,4);
const monthEnd=k=>{const y=+k.slice(0,4),m=+k.slice(5,7);return iso(new Date(y,m,0))};
const dayLabel=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtShort=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+' '+MN[x.getMonth()]+' '+x.getFullYear()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const initial=n=>(String(n).trim()[0]||'?').toUpperCase();

/* ================= example entries (in memory only) ================= */
function makeExamples(pid){
  const k=TODAY.slice(0,7),td=+TODAY.slice(8,10),d=n=>k+'-'+pad(Math.min(n,td));
  const rows={
    self:[['income',1,85000,'salary','bank',null,'October salary'],['expense',2,22000,'rent','bank',null,'Flat rent'],
      ['transfer',3,5000,null,'bank','elss','Monthly SIP'],['transfer',3,4000,null,'bank','nps','NPS contribution'],
      ['transfer',5,9500,null,'bank','carloan','Car EMI principal'],['expense',5,2100,'other','bank',null,'Car EMI interest'],
      ['expense',6,3240,'groceries','card',null,'Weekly shop'],['expense',8,1450,'utilities','bank',null,'Electricity bill'],
      ['expense',10,15000,'school','bank',null,'Term fees'],['expense',12,860,'dining','card',null,'Dinner out'],
      ['transfer',15,12000,null,'bank','card','Card bill payment'],['expense',16,600,'transport','cash',null,'Auto & metro']],
    spouse:[['income',1,42000,'salary','bank',null,'October salary'],['transfer',4,3000,null,'bank','ppf','PPF deposit'],
      ['expense',6,1800,'shopping','card',null,'Kurta'],['expense',9,499,'utilities','bank',null,'Mobile recharge'],
      ['expense',11,650,'dining','card',null,'Lunch with friends'],['expense',14,900,'transport','cash',null,'Cabs']],
    child:[['income',1,1000,'gift','cash',null,'Pocket money'],['expense',4,120,'dining','cash',null,'School canteen'],
      ['expense',7,350,'shopping','cash',null,'Stationery'],['income',10,500,'gift','bank',null,'Birthday gift from Nani'],
      ['expense',13,200,'fun','cash',null,'Comics']]
  }[pid]||[];

function effect(t,acc,pid){
  const a=acctById(acc,pid);if(!a)return 0;const sign=a.kind==='asset'?1:-1;let v=0;
  if(t.type==='adjust')return t.acct===acc?t.amt:0;
  if(t.type==='expense'&&t.acct===acc)v-=t.amt;
  if(t.type==='income'&&t.acct===acc)v+=t.amt;
  if(t.type==='transfer'){if(t.acct===acc)v-=t.amt;if(t.to===acc)v+=t.amt}
  return v*sign;
}
function worth(upto,pid=PID){
  const s=store(pid),b={};for(const a of s.accounts)b[a.id]=num(a.opening);
  for(const t of txOf(pid)){if(t.date<s.asOf||(upto&&t.date>upto))continue;for(const a of s.accounts){const e=effect(t,a.id,pid);if(e)b[a.id]+=e}}
  let As=0,L=0;for(const a of s.accounts)(a.kind==='asset'?(As+=b[a.id]):(L+=b[a.id]));return{A:As,L,N:As-L,b};
}

/* ================= tax engine ================= */
function slabTax(x,bands){let t=0,lo=0;for(const[hi,r]of bands){if(x>lo)t+=(Math.min(x,hi)-lo)*r;lo=hi}return Math.round(t)}
function computeTax(I){
  const R=Math.round,sen=I.age!=='below60',out={};
  const o={};o.gross=I.gross;o.exempt=Math.min(I.exempt,I.gross);
  o.std=Math.min(50000,Math.max(0,o.gross-o.exempt));o.ptax=Math.min(I.profTax,2500,Math.max(0,o.gross-o.exempt-o.std));
  o.salary=Math.max(0,o.gross-o.exempt-o.std-o.ptax);
  o.hp=Math.max(I.rent>0?R(I.rent*0.7)-I.hlInt:-Math.min(I.hlInt,200000),-200000);
  o.other=I.sbInt+I.otherInt;o.gti=Math.max(0,o.salary+o.hp+o.other);
  const p={c80C:Math.min(I.d80C,150000),c1B:Math.min(I.d1B,50000),c80D:Math.min(I.d80D,sen?50000:25000),
    cTT:sen?Math.min(I.sbInt+I.fdInt,50000):Math.min(I.sbInt,10000),c80G:R(I.d80G*0.5),c2:I.c80CCD2};
  o.parts=p;o.ded=Math.min(o.gti,p.c80C+p.c1B+p.c80D+p.cTT+p.c80G+p.c2);
  o.taxable=R(Math.max(0,o.gti-o.ded)/10)*10;
  const ex=I.age==='above80'?500000:I.age==='60to80'?300000:250000;
  o.slab=slabTax(o.taxable,[[ex,0],[Math.max(ex,500000),.05],[1000000,.2],[Infinity,.3]]);
  o.rebate=o.taxable<=500000?Math.min(o.slab,12500):0;o.relief=0;
  o.after=o.slab-o.rebate;o.cess=R(o.after*.04);o.total=o.after+o.cess;
  const n={};n.gross=I.gross;n.std=Math.min(75000,I.gross);n.salary=Math.max(0,I.gross-n.std);
  n.hp=I.rent>0?Math.max(0,R(I.rent*0.7)-I.hlInt):0;n.other=o.other;n.gti=Math.max(0,n.salary+n.hp+n.other);
  n.ded=Math.min(n.gti,I.c80CCD2);n.taxable=R(Math.max(0,n.gti-n.ded)/10)*10;
  n.slab=slabTax(n.taxable,[[400000,0],[800000,.05],[1200000,.1],[1600000,.15],[2000000,.2],[2400000,.25],[Infinity,.3]]);
  n.rebate=n.taxable<=1200000?Math.min(n.slab,60000):0;
  n.relief=n.taxable>1200000?Math.max(0,n.slab-(n.taxable-1200000)):0;
  n.after=n.slab-n.rebate-n.relief;n.cess=R(n.after*.04);n.total=n.after+n.cess;
  out.old=o;out.new=n;out.best=o.total<n.total?'old':'new';out.saving=Math.abs(o.total-n.total);
  out.itr1=Math.max(o.gti,n.gti)<=5000000;out.due=out[out.best].total-I.tds;return out;

  const T=store(pid).settings.tax,from=fy+'-04-01',to=(fy+1)+'-03-31',a={sal:0,sbInt:0,fdInt:0,div:0,rent:0,hlInt:0,c80C:0,c1B:0,c80D:0,c80G:0,other:0};
  for(const t of txOf(pid)){

    if(t.type==='income'){if(t.cat==='salary'||t.cat==='bonus')a.sal+=t.amt;else if(t.cat==='sbint')a.sbInt+=t.amt;else if(t.cat==='fdint')a.fdInt+=t.amt;else if(t.cat==='dividend')a.div+=t.amt;else if(t.cat==='rentin')a.rent+=t.amt;else a.other+=t.amt}
    if(t.type==='expense'){const tg=CATMAP[t.cat]?.tax;if(tg==='80C')a.c80C+=t.amt;if(tg==='80D')a.c80D+=t.amt;if(tg==='80G')a.c80G+=t.amt;if(t.cat==='hlint')a.hlInt+=t.amt}

  }
  const I={gross:num(T.gross),exempt:num(T.exempt),profTax:num(T.profTax),age:T.age,sbInt:a.sbInt,fdInt:a.fdInt,
    otherInt:a.fdInt+a.div+num(T.extraOther),rent:a.rent,hlInt:a.hlInt,d80C:a.c80C+num(T.epf)+num(T.extra80C),
    d1B:a.c1B+num(T.extra1B),d80D:a.c80D+num(T.extra80D),d80G:a.c80G,c80CCD2:num(T.c80CCD2),tds:num(T.tds)};
  return{I,a};
}

  let notes='';
  if(c==='nw'&&d.series.some(s=>s.vals.some((v,i)=>v==null&&(st.p==='yoy'||d.keys[i]<=TODAY.slice(0,7))))){const first=PIDS().map(p=>store(p).asOf).sort()[0];notes+=`<p class="chnote">Net worth history starts from the opening-balance date (${fmtShort(first)}). Set an earlier date under "Opening balances as on" to fill in older months and years.</p>`}
  if(st.p==='yoy'&&d.keys.includes(cur))notes+=`<p class="chnote">FY ${fyLabel(cur)} is the current year and covers ${fyMonths(cur).filter(m=>m<=TODAY.slice(0,7)).length} months so far.${c==='sum'&&st.avg!=='avg'?' Switch to Monthly average for a fair comparison.':''}</p>`;

      return `<tr><td><button class="btn link" data-act="setFy" data-v="${y}" style="padding:0;${y===V.gfy?'text-decoration:underline':''}">FY ${fyShort(y)}</button></td><td class="num cr">${NF.format(i)}</td><td class="num dr">${NF.format(e)}</td><td class="num ${sv<0?'dr':''}">${sv<0?'('+NF.format(-sv)+')':NF.format(sv)}</td><td class="num muted">${i?Math.round(sv/i*100)+'%':'—'}</td></tr>`}).join('')}</tbody></table></div>`}
    else{const N=d.keys.map(y=>{const w=worthAt(y>=cur?TODAY:(y+1)+'-03-31',PIDS());return w});

      return `<tr><td><button class="btn link" data-act="setFy" data-v="${y}" style="padding:0;${y===V.gfy?'text-decoration:underline':''}">${y>=cur?'Today':'Mar '+String(y+1).slice(2)}</button></td><td class="num cr">${w?NF.format(w.A):'—'}</td><td class="num dr">${w?NF.format(w.L):'—'}</td><td class="num">${w?NF.format(w.N):'—'}</td><td class="num ${chg<0?'dr':chg>0?'cr':''}">${chg==null?'—':(chg<0?'−':'+')+NF.format(Math.abs(chg))}</td></tr>`}).join('')}</tbody></table></div>`}
  }
  return `<div class="panel"><h3>${title}</h3>${ctl}${hasData?ro+chartSVG(c,d.labels,d.series,st.t,sel)+'<p class="chnote">Tap any '+(st.p==='mom'?'month':'year')+' on the chart to see its figures.</p>':'<p class="small muted">Nothing to chart yet for this selection.</p>'}${notes}${table}</div>`;
}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function shortRs(v){return v>=1e5?(v/1e5).toFixed(v%1e5?1:0)+'L':v>=1e3?(v/1e3).toFixed(0)+'k':String(Math.round(v))}
function fyChart(data,sel){
  const W=640,H=220,L=44,Bm=26,T=10,max=niceMax(Math.max(...data.map(d=>Math.max(d.i,d.e)))),cw=(W-L-6)/12,bw=Math.min(16,cw/2-3);
  const y=v=>T+(H-T-Bm)*(1-v/max);let g='';
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="ui-monospace, Menlo, monospace">${shortRs(v)}</text>`}
  data.forEach((d,i)=>{const x=L+i*cw+cw/2;
    g+=`<rect x="${x-bw-1}" y="${y(d.i)}" width="${bw}" height="${Math.max(0,H-Bm-y(d.i))}" fill="var(--credit)" rx="2"/>`;
    g+=`<rect x="${x+1}" y="${y(d.e)}" width="${bw}" height="${Math.max(0,H-Bm-y(d.e))}" fill="var(--debit)" rx="2"/>`;
    g+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="11" fill="${d.m===sel?'var(--ink)':'var(--muted)'}" font-weight="${d.m===sel?600:400}" font-family="-apple-system, system-ui, sans-serif">${MN[+d.m.slice(5)-1]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly income and spending">${g}</svg>`;
}

function renderTaxMulti(){
  const fy=V.gfy,pids=PIDS();let tot=0,tds=0,bal=0;
  const rows=pids.map(pid=>{const p=person(pid);
    if(p.role==='child'){const{a}=taxInputs(fy,pid),cl=Math.max(0,a.sbInt+a.fdInt+a.div+a.rent-1500);
      return `<tr><td><button class="btn link" data-act="pick" data-v="${pid}" style="padding:0">${esc(p.name)}</button><div class="small muted">Minor · no separate return</div></td><td>—</td><td class="num">—</td><td class="num">—</td><td class="num muted">${cl?'+'+NF.format(cl)+' clubbed':'—'}</td></tr>`}
    const{I}=taxInputs(fy,pid),r=computeTax(I),t=r[r.best].total,b=t-I.tds;tot+=t;tds+=I.tds;bal+=b;
    return `<tr><td><button class="btn link" data-act="pick" data-v="${pid}" style="padding:0">${esc(p.name)}</button>${store(pid).settings.taxSaved?'':'<div class="small muted">Sample salary</div>'}</td><td>${r.best==='new'?'New':'Old'}</td><td class="num">${NF.format(t)}</td><td class="num">${I.tds?NF.format(I.tds):'—'}</td><td class="num ${b>0?'dr':b<0?'cr':''}">${b>0?NF.format(b):b<0?'('+NF.format(-b)+')':'—'}</td></tr>`}).join('');
  $('#tab-tax').innerHTML=`<div class="mstep"><button class="btn" data-act="fy" data-v="-1" aria-label="Previous year">‹</button><span class="m">Combined tax · FY ${fyLabel(fy)}<br><span class="small muted" style="font-family:var(--body)">AY ${fyLabel(fy+1)} · ${esc(WHO())}</span></span><button class="btn" data-act="fy" data-v="1" aria-label="Next year">›</button></div>
  <div class="hero"><div><div class="lbl">Household income tax this year</div><div class="bigsave">${rs(tot)}</div><div class="sub">Each earning adult on their lower regime${tds?` · TDS so far ${rs(tds)}`:''}</div></div>

  <tr class="tot"><td>Total</td><td></td><td class="num">${NF.format(tot)}</td><td class="num">${tds?NF.format(tds):'—'}</td><td class="num ${bal>0?'dr':bal<0?'cr':''}">${bal>0?NF.format(bal):bal<0?'('+NF.format(-bal)+')':'—'}</td></tr></tbody></table></div>
  <p class="small muted" style="margin-bottom:0">Income tax is filed per person, so ITR-1 details stay in each person's own tab. Tap a name to open their full computation and enter Form 16 figures.</p></div>`;
}

function sparkline(h,start){

  const x=i=>Pd+(W-2*Pd)*i/Math.max(1,pts.length-1),y=v=>Pd+(H-2*Pd)*(1-(v-mn)/rg);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:10px" role="img" aria-label="Net worth through the year"><path d="${d} L${x(last)} ${H} L${x(0)} ${H}Z" fill="var(--tint)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(last)}" cy="${y(pts[last].v)}" r="4" fill="var(--accent)"/></svg>`;

const CFIELDS={sip:[['amt','Monthly investment','₹'],['rate','Expected return','% a year'],['yrs','Time','years'],['step','Yearly step-up','%']],lump:[['amt','One-time investment','₹'],['rate','Expected return','% a year'],['yrs','Time','years']],
  emi:[['amt','Loan amount','₹'],['rate','Interest rate','% a year'],['yrs','Tenure','years']],fd:[['amt','Deposit','₹'],['rate','Interest rate','% a year'],['yrs','Time','years']],
  ppf:[['amt','Yearly deposit (max 1.5L)','₹'],['rate','PPF rate','% a year'],['yrs','Years (15 or more)','years']],goal:[['amt','Goal cost today','₹'],['yrs','Years to goal','years'],['infl','Inflation','% a year'],['rate','Expected return','% a year']]};
V.tool='calc';V.calc='sip';V.ci=clone(CDEF);try{const c=JSON.parse(localStorage.getItem('gharkhata.calc')||'null');if(c)for(const k in CDEF)V.ci[k]={...CDEF[k],...(c[k]||{})}}catch(e){}
function calcOut(k){
  const c=V.ci[k],A=num(c.amt),r=num(c.rate),n=Math.max(0,num(c.yrs));
  const two=(a,b,la,lb,ca,cb)=>{const t=a+b||1;return `<div class="split"><i style="width:${a/t*100}%;background:${ca}"></i><i style="width:${b/t*100}%;background:${cb}"></i></div><div class="legend"><span><i style="background:${ca}"></i>${la} ${rs(a)}</span><span><i style="background:${cb}"></i>${lb} ${rs(b)}</span></div>`};
  if(k==='sip'||k==='lump'||k==='fd'||k==='ppf'){let inv=0,fv=0;
    if(k==='sip'){const i=r/1200,N=Math.round(n*12),st=num(c.step)/100;for(let m=0;m<N;m++){const a=A*Math.pow(1+st,Math.floor(m/12));inv+=a;fv+=a*Math.pow(1+i,N-m)}}
    if(k==='lump'){inv=A;fv=A*Math.pow(1+r/100,n)}
    if(k==='fd'){inv=A;fv=A*Math.pow(1+r/400,4*n)}
    if(k==='ppf'){const d=Math.min(A,150000);for(let y=0;y<Math.round(n);y++){inv+=d;fv=(fv+d)*(1+r/100)}}
    return `<div class="label">${k==='fd'?'Maturity amount':k==='ppf'?'Maturity value':'Estimated value'} after ${n} year${n===1?'':'s'}</div><div class="bigv">${rs(fv)}</div>${two(inv,fv-inv,'Invested','Gains','var(--c3)','var(--credit)')}${k==='ppf'&&A>150000?'<p class="impnote">PPF accepts at most ₹1.5 lakh a year, so ₹1.5 lakh is used.</p>':''}${k==='fd'?'<p class="impnote">Compounded quarterly, before tax. FD interest is taxable as other income.</p>':''}`}
  if(k==='emi'){const i=r/1200,N=Math.round(n*12);const emi=N?(i?A*i*Math.pow(1+i,N)/(Math.pow(1+i,N)-1):A/N):0,tot=emi*N;
    return `<div class="label">Monthly EMI</div><div class="bigv">${rs(emi)}</div>${two(A,tot-A,'Principal','Interest','var(--c3)','var(--debit)')}<p class="impnote">Total paid over ${n} years: ${rs(tot)}. A 0.25% rate rise would make the EMI about ${rs(N?(()=>{const j=(r+0.25)/1200;return A*j*Math.pow(1+j,N)/(Math.pow(1+j,N)-1)})():0)}.</p>`}
  if(k==='goal'){const fut=A*Math.pow(1+num(c.infl)/100,n),i=r/1200,N=Math.round(n*12),sip=N?(i?fut*i/((Math.pow(1+i,N)-1)*(1+i)):fut/N):0,lump=fut/Math.pow(1+r/100,n);
    return `<div class="label">Monthly SIP needed</div><div class="bigv">${rs(sip)}</div><p class="impnote" style="color:var(--ink)">The goal will cost about <b class="num">${rs(fut)}</b> in ${n} years at ${num(c.infl)}% inflation. Or invest <b class="num">${rs(lump)}</b> once today.</p>`}
  return'';
}
function toolPanel(){
  const seg=`<div class="seg sm" style="grid-template-columns:1fr 1fr" role="group" aria-label="Tools"><button type="button" data-act="tool" data-v="calc" aria-pressed="${V.tool==='calc'}">Calculators</button><button type="button" data-act="tool" data-v="news" aria-pressed="${V.tool==='news'}">News & info</button></div>`;
  if(V.tool==='news')return `<div class="panel tools">${seg}${newsPanel()}</div>`;
  const k=V.calc,c=V.ci[k];
  return `<div class="panel tools">${seg}<div class="calcs">${CALCS.map(([id,l])=>`<button type="button" class="chip" data-act="calc" data-v="${id}" aria-pressed="${id===k}">${l}</button>`).join('')}</div>
    <div class="formgrid">${CFIELDS[k].map(([f,l,u])=>`<div class="field"><label for="ci-${k}-${f}">${l} <span class="muted">(${u})</span></label><input class="num" id="ci-${k}-${f}" data-ci="${f}" inputmode="decimal" value="${c[f]}"></div>`).join('')}</div>
    <div class="cres" id="calcOut">${calcOut(k)}</div><p class="impnote" style="margin-top:8px">Estimates at a fixed rate. Real returns change from year to year.</p></div>`;
}

  <div class="label" style="margin:16px 0 4px">Latest news</div>

  <p class="impnote" style="margin-top:10px">This app can't pull live headlines into the page, so news opens on the source site. Rates and dates were checked on 19 Oct 2026 and may change.</p>`;
}

    if(k==='date'){if(el.value)V.cas.date=el.value}else if(k==='on')h.on=el.checked;else if(k==='val')h.val=num(el.value);else if(k==='acct')h.acct=el.value;renderSettings();return}
  if(el.dataset.bank&&V.bank){const k=el.dataset.bank,B=V.bank,r=B.rows[+el.dataset.i];
    if(k==='on')r.on=el.checked;else if(k==='sel')r.sel=el.value;else if(k==='setBal')B.setBal=el.checked;else if(k==='addTx')B.addTx=el.checked;else if(k==='newName')B.newName=el.value;
    else if(k==='acct'){B.acct=el.value;B.rows.forEach(x=>{if(x.sel.startsWith('t:')&&x.sel.slice(2)===B.acct)x.sel=guessCat(x,B.pid,B.acct)})}
    renderSettings();return}
  if(!PID||el.id==='fySel'||el.dataset.pw||el.dataset.ci)return;const s=P();
  if(el.dataset.catname){const v=el.value.trim(),id=el.dataset.catname;if(v&&v!==CATMAP[id]?.name)s.settings.catNames[id]=v;else delete s.settings.catNames[id];saveSettings(PID);renderToday();return}
  if(el.dataset.bud){s.settings.budgets[el.dataset.bud]=num(el.value);saveSettings(PID);return}
  if(el.dataset.tax){s.settings.tax[el.dataset.tax]=el.dataset.tax==='age'?el.value:num(el.value);s.settings.taxSaved=true;saveSettings(PID);renderTax();return}
  if(el.dataset.acf){const a=acctById(el.dataset.v);if(!a)return;const f=el.dataset.acf;
    if(f==='opening')a.opening=num(el.value);else if(f==='tax'){if(el.value)a.tax=el.value;else delete a.tax}else a[f]=el.value.trim()||a[f];
    saveAccounts(PID);renderAll();return}
  if(el.id==='asOf'&&el.value){s.asOf=el.value;saveAccounts(PID);renderAll();return}
  if(el.id==='f-acct')fixTo();
  if(el.id==='f-to'||el.id==='f-acct')updateTaxHint();
});
$('#qa').addEventListener('submit',submitTx);
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.pw){V.pw[el.dataset.pw]=el.value;return}
  if(el.dataset.bkpw){V['bkPw'+el.dataset.bkpw]=el.value;return}
  if(el.dataset.ci){V.ci[V.calc][el.dataset.ci]=el.value;const o=$('#calcOut');if(o)o.innerHTML=calcOut(V.calc);try{localStorage.setItem('gharkhata.calc',JSON.stringify(V.ci))}catch(x){}}});
$('#fySel').addEventListener('change',e=>setFY(+e.target.value));
$('#cancelEdit').addEventListener('click',()=>{cancelEdit();renderToday()});

function addCategory(raw,type,select){
  const name=String(raw||'').trim();if(!name){flash('Type a name for the category.');return}
  const s=P(),exist=catsFor(type).find(c=>catName(c.id,PID).toLowerCase()===name.toLowerCase());
  if(exist){flash(name+' already exists.');if(select){V.cat=exist.id;V.newCat=false;catChips()}return}
  const old=s.settings.customCats.find(c=>c.gone&&c.type===type&&c.name.toLowerCase()===name.toLowerCase());
  let id;if(old){old.gone=false;id=old.id}else{id='c'+uid();s.settings.customCats.push({id,name,type})}
  saveSettings(PID);if(select){V.cat=id;V.newCat=false;catChips();updateTaxHint()}else{const i=$('#nc2-name');if(i)i.value='';renderBudget()}
  flash('Added category '+name,true);
}

renderLock();
boot();
</script>
